<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Circular Mask for your Profile Image -->
    <clipPath id="avatar-clip">
      <circle cx="120" cy="120" r="95" />
    </clipPath>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyberpunk Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <style>
    .rotate-ring {
      transform-origin: 120px 120px;
      animation: rotateRing 6s linear infinite;
    }
    .pulse-ring {
      transform-origin: 120px 120px;
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.55; stroke-width: 3.5; }
      100% { opacity: 1; stroke-width: 5.5; }
    }
  </style>

  <!-- Pulsing Outer Neon Halo -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="#00F2FE" stroke-opacity="0.3" filter="url(#glow)" class="pulse-ring" />

  <!-- Profile Image clipped into circle -->
  <image xlink:href="https://github.com/AvinashTiwary332.png" x="25" y="25" width="190" height="190" clip-path="url(#avatar-clip)" />

  <!-- Spinning Cyberpunk Neon Dashed Ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#neonGradient)" stroke-dasharray="28 14 10 14" stroke-linecap="round" filter="url(#glow)" class="rotate-ring pulse-ring" />
</svg>
