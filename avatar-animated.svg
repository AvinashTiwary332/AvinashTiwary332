<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Perfect Circular Mask for Face -->
    <clipPath id="avatar-circle">
      <circle cx="130" cy="130" r="92" />
    </clipPath>

    <!-- Glowing Filter Effect -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Cyberpunk Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F75C7E" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>

  <style>
    .spin-ring {
      transform-origin: 130px 130px;
      animation: spin 8s linear infinite;
    }
    .counter-spin {
      transform-origin: 130px 130px;
      animation: spinReverse 12s linear infinite;
    }
    .pulse-glow {
      transform-origin: 130px 130px;
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.6; stroke-width: 2.5; }
      100% { opacity: 1; stroke-width: 4.5; }
    }
  </style>

  <!-- Ambient Outer Glowing Ring -->
  <circle cx="130" cy="130" r="108" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="2" filter="url(#neon-glow)" class="pulse-glow" />

  <!-- Outer Cyber Tech Counter-Rotating Ring -->
  <circle cx="130" cy="130" r="104" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="12 28 8 28" class="counter-spin" />

  <!-- Main Neon Cyan Rotating Ring -->
  <circle cx="130" cy="130" r="97" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="32 14 12 14" stroke-linecap="round" filter="url(#neon-glow)" class="spin-ring" />

  <!-- Circular Masked Avatar Photo (avatar.png) -->
  <g clip-path="url(#avatar-circle)">
    <image href="avatar.png" x="25" y="25" width="210" height="210" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Inner Highlighting Ring -->
  <circle cx="130" cy="130" r="92" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.85" />
</svg>
